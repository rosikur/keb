# Documentation: https://rmk.rs/docs/configuration.html
[keyboard]
name = "RMK Keyboard"
product_name = "RMK Keyboard"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "RMK"
chip = "rp2040"

[[input_device.encoder]]
pin_a = "P0_20"
pin_b = "P0_21"

# Whether to use the MCU's internal pull-up resistor, default to false
internal_pullup = true

# Working mode of the encoder
# Available modes:
# - default: resolution = 1
# - resolution: custom resolution, requires specifying resolution and reverse parameters
phase = "resolution"

# `resolution` represents the number of steps generated per detent.
#
# When your encoder datasheet lists:
#   - detent = number of mechanical detents per full rotation
#   - pulse  = number of full quadrature cycles (A/B cycles) per full rotation
#
# Then the relationship is:
#   resolution = (pulse × 4) / detent
# because each full quadrature cycle (pulse) produces 4 edge transitions.
#
# For example — in the ALPS EC11E series (https://tech.alpsalpine.com/cms.media/product_catalog_ec_01_ec11e_en_611f078659.pdf):
#   detent = 30, pulse = 15 → resolution = (15 × 4) / 30 = 2
resolution = 2



# Whether the direction of the rotary encoder is reversed.
reverse = false

[matrix]
# Row and col pins are mandatory
row_pins = ["P0_0", "P0_1", "P0_2", "P0_3" , "P0_4" , "P0_26"]
col_pins = ["P0_5", "P0_6", "P0_7" , "P0_8","P0_9","P0_10","P0_11","P0_12","P0_13","P0_14","P0_15","P0_16","P0_17","P0_18","P0_19",]

# RMK uses col2row as the default matrix diode direction, if you want to use a row2col matrix, add `row2col = true`
# row2col = true

[layout]
rows = 6
cols = 15
layers = 2
keymap = [
    [
        ["Esc", "F1", "F2","F3","F4", "F5","F6" ,"F7" , "F8" , "F9","F10", "F11" , "F12","_","_"],
        ["Grv", "1", "2", "3" , "4" , "5","6","7","8","9" ,"0", "mins" , "eql", "bspc","_"],
        ["Tab", "Q", "W", "E" ,"R","T", "Z" ,"U" , "I" , "O" , "P","LeftBracket" , "RightBracket" , "bsls","_" ],
        ["CapsLock", "A", "S" , "D" , "F" ,"G" ,"H" ,"J","K","L","Scln", "Quote","ent","_","_"],
        ["LShift" , "Y" ,"X" , "C" , "V" , "B", "N","M" ,"comma", "dot" ,"slsh","RShift" , "Up","_","_"],
        ["LCtrl" ,"LGui","LAlt","spc", "RAlt","MO(1)","RCtrl","Left","Down", "Right","_","_","_","_","_" ],
    ],
    [
        ["_", "mute", "vold", "volu","brid" , "briu" , "lpad" , "mctl" , "mnxt" , "mprv" , "mstp" ,"mply" ,"cpnl","_","_"],
        ["_", "_", "_", "_","_","_","_","_","_","_","_","_","_","del","_"],
        ["_", "_", "_","_","_","_","_","_","_","_","_","_","_","_","_"],
        ["_", "_", "_", "_","_","_","_","_","_","_","_","_","_","_","_"],
        ["_", "_", "_", "_","_","_","_","_","_","_","_","_","_","_","_"],
        ["_", "_", "_", "_","_","_","_","_","_","_","_","_","_","_","_"],
    ],
]
encoder_map = [
  [["AudioVolUp", "AudioVolDown"]]
]
